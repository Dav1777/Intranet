spring.application.name=intranet
server.port=8080

# --- CONFIGURAÇÃO DO MYSQL ---
# Substitua 'nome_do_teu_banco' pelo nome do schema que tu criou no MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/intranet?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=brocha

# --- CONFIGURAÇÃO DO HIBERNATE / JPA ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# --- FLYWAY ---
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true